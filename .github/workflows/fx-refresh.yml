name: Daily FX Rate Refresh

on:
  schedule:
    # Run at 06:00 UTC every day
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      base_currency:
        description: 'Base currency (default: ILS)'
        required: false
        default: 'ILS'

jobs:
  refresh-fx-rates:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Validate required secrets
        run: |
          KEY="${SUPABASE_PUBLISHABLE_KEY:-$SUPABASE_ANON_KEY}"
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::Missing SUPABASE_URL"
            exit 1
          fi
          if [ -z "$KEY" ]; then
            echo "::error::Missing SUPABASE_PUBLISHABLE_KEY (or legacy SUPABASE_ANON_KEY)"
            exit 1
          fi

      # ILS as primary base — covers all currencies via inverse lookup
      - name: Refresh ILS rates
        run: |
          CURRENCY="${{ github.event.inputs.base_currency || 'ILS' }}"
          DATE=$(date -u +%Y-%m-%d)
          KEY="${SUPABASE_PUBLISHABLE_KEY:-$SUPABASE_ANON_KEY}"

          echo "Refreshing FX rates for ${CURRENCY} on ${DATE}..."

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${KEY}" \
            -H "apikey: ${KEY}" \
            -d "{\"base_currency\": \"${CURRENCY}\", \"date\": \"${DATE}\"}" \
            "${SUPABASE_URL}/functions/v1/fx-refresh-daily-rates")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          echo "Response (${HTTP_CODE}): ${BODY}"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::FX refresh failed with HTTP ${HTTP_CODE}: ${BODY}"
            exit 1
          fi

          echo "FX rates refreshed successfully!"

      # USD as universal cross-rate fallback
      - name: Refresh USD rates
        run: |
          DATE=$(date -u +%Y-%m-%d)
          KEY="${SUPABASE_PUBLISHABLE_KEY:-$SUPABASE_ANON_KEY}"
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${KEY}" \
            -H "apikey: ${KEY}" \
            -d "{\"base_currency\": \"USD\", \"date\": \"${DATE}\"}" \
            "${SUPABASE_URL}/functions/v1/fx-refresh-daily-rates")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          echo "Response (${HTTP_CODE}): ${BODY}"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::USD FX refresh failed with HTTP ${HTTP_CODE}: ${BODY}"
            exit 1
          fi

      # GBP base for explicit GBP <> ILS coverage
      - name: Refresh GBP rates
        run: |
          DATE=$(date -u +%Y-%m-%d)
          KEY="${SUPABASE_PUBLISHABLE_KEY:-$SUPABASE_ANON_KEY}"
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${KEY}" \
            -H "apikey: ${KEY}" \
            -d "{\"base_currency\": \"GBP\", \"date\": \"${DATE}\"}" \
            "${SUPABASE_URL}/functions/v1/fx-refresh-daily-rates")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          echo "Response (${HTTP_CODE}): ${BODY}"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::GBP FX refresh failed with HTTP ${HTTP_CODE}: ${BODY}"
            exit 1
          fi
